<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/oatle-kids-192.png?v=2"
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS / iPadOS -->
    <link rel="apple-touch-icon" href="/icons/oatle-kids-180.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#080d28" />

    <!-- Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS / iPadOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Oatle Kids"
    />

    <title>Oatle Kids</title>
    <link rel="stylesheet" href="/src/startup.css" />
    <meta name="robots" content="noindex, follow" />
  </head>

  <body>
    <div id="root">
      <main class="startup-screen" aria-labelledby="startup-title">
        <div class="startup-content">
          <img src="/oatle-kids-wordmark.webp" alt="" width="200" fetchpriority="high" />
          <h1 id="startup-title">Welcome to Oatle Kids</h1>
          <p>A universe of learning opportunities</p>
          <p class="startup-status" role="status">
            <span class="startup-orbit" aria-hidden="true"></span>
            Your multiverse is loading…
          </p>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
