# Deploy these existing functions by their live endpoint names.
[functions.quick-service]
entrypoint = "./functions/quick-service/create-payfast-checkout.ts"
verify_jwt = false

[functions.hyper-action]
entrypoint = "./functions/redeem-promo/redeem-promo.ts"
verify_jwt = false

[functions.payfast-itn]
entrypoint = "./functions/payfast-itn/index.ts"
verify_jwt = false

[functions.parent-email]
# The handler verifies the bearer token with auth.getUser (supports current signing keys).
verify_jwt = false

[functions.email-worker]
# Gateway JWT plus the private X-Email-Worker-Secret header are both required.
verify_jwt = true

[functions.email-unsubscribe]
# The signed unsubscribe token authenticates the request.
verify_jwt = false

[functions.subscription-email]
# The scheduled worker authenticates with its dedicated private secret.
verify_jwt = false

[functions.marketing-reminder]
verify_jwt = false

[functions.newsletter-sync]
verify_jwt = false
