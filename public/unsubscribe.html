<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Oatle Kids email preferences</title>
  <style>
    body { margin: 0; padding: 3rem 1.5rem; background: #11182c; color: #fff; font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 34rem; margin: auto; }
    button { padding: .75rem 1rem; font: inherit; color: #11182c; background: #fff; border: 0; border-radius: .35rem; cursor: pointer; }
    a { color: #b4d2ff; }
  </style>
  <script src="/unsubscribe.js" defer></script>
</head>
<body>
  <main>
    <h1>Stop marketing emails</h1>
    <form id="unsubscribe-form" hidden>
      <button type="submit">Unsubscribe from Oatle Kids updates</button>
    </form>
    <p id="status" role="status"></p>
    <p><a href="/app.html">Open Oatle Kids</a></p>
  </main>
</body>
</html>
